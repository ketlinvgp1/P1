<div class="container py-4">

    <div class="text-center mb-4">
        <h1>Destinos em Destaque</h1>
        <p>Conheça alguns dos destinos que separamos para você!</p>
    </div>

    <div class="row">

        <div
            class="col-12 col-md-4 mb-4"
            *ngFor="let obj of lista">

            <div class="card h-100">

                <!-- CARROSSEL -->
                <div
                    id="carousel{{obj.codigo}}"
                    class="carousel slide">

                    <div class="carousel-inner">

                        <!-- Imagem 1 -->
                        <div class="carousel-item active">
                            <img
                                src="{{obj.codigo}}.jpg"
                                class="d-block w-100 imagem-destaque"
                                alt="{{obj.nome}}">
                        </div>

                        <!-- Imagem 2 -->
                        <div class="carousel-item">
                            <img
                                src="{{obj.codigo}}-2.jpg"
                                class="d-block w-100 imagem-destaque"
                                alt="{{obj.nome}}">
                        </div>

                        <!-- Imagem 3 -->
                        <div class="carousel-item">
                            <img
                                src="{{obj.codigo}}-3.jpg"
                                class="d-block w-100 imagem-destaque"
                                alt="{{obj.nome}}">
                        </div>

                        <!-- Imagem 4 -->
                        <div class="carousel-item">
                            <img
                                src="{{obj.codigo}}-4.jpg"
                                class="d-block w-100 imagem-destaque"
                                alt="{{obj.nome}}">
                        </div>

                    </div>

                    <!-- Botão anterior -->
                    <button
                        class="carousel-control-prev"
                        type="button"
                        [attr.data-bs-target]="'#carousel' + obj.codigo"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <!-- Botão próximo -->
                    <button
                        class="carousel-control-next"
                        type="button"
                        [attr.data-bs-target]="'#carousel' + obj.codigo"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>
                    </button>

                </div>

                <!-- INFORMAÇÕES -->
                <div class="card-body">

                    <h4>{{obj.nome}}</h4>

                    <p>{{obj.descritivo}}</p>

                    <p>
                        De:
                        <s>R$ {{obj.valor}}</s>
                    </p>

                    <h5>
                        Por: R$ {{obj.promo}}
                    </h5>
                </div>
            </div>
        </div>
    </div>
</div>
