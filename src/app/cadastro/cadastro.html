<div class="cadastro-container d-flex justify-content-center align-items-center">

    <div class="card cadastro-card shadow-lg border-0 rounded-4">

        <div class="card-body p-4 p-md-5">

            <h3 class="text-center mb-2">Cadastro</h3>

            <p class="subtitulo text-center mb-4">
                Crie sua conta para continuar
            </p>

            <form class="was-validated">

                <!-- Nome -->
                <div class="mb-3">
                    <label for="txtNome" class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="txtNome"
                        placeholder="Informe o seu nome"
                        required>

                    <div class="invalid-feedback">
                        Preencha esse campo!
                    </div>
                </div>


                
                <div class="mb-3">
                    <label for="txtEmail" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="txtEmail"
                        placeholder="Informe o seu e-mail"
                        required>

                    <div class="invalid-feedback">
                        Informe um e-mail válido!
                    </div>
                </div>


            
                <div class="mb-3">
                    <label for="txtTelefone" class="form-label">
                        Telefone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="txtTelefone"
                        placeholder="Ex: 11 999999999"
                        required
                        pattern="[0-9]{2} [0-9]{9}">

                    <div class="invalid-feedback">
                        Informe um telefone válido!
                    </div>
                </div>


                
                <div class="mb-3">
                    <label for="txtDocumento" class="form-label">
                        CPF
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="txtDocumento"
                        placeholder="Ex: 123.456.789-00"
                        maxlength="14"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        required>

                    <div class="invalid-feedback">
                        Preencha esse campo!
                    </div>
                </div>


                
                <div class="mb-3">
                    <label for="txtSenha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="txtSenha"
                        placeholder="Informe a sua senha"
                        required
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}">

                    <div class="invalid-feedback">
                        A senha deve conter pelo menos 8 caracteres,
                        uma letra maiúscula, uma minúscula,
                        um número e um caractere especial.
                    </div>
                </div>


                            <div class="mb-4">
                    <label for="txtLogradouro" class="form-label">
                        Endereço
                    </label>

                    <textarea
                        class="form-control"
                        id="txtLogradouro"
                        placeholder="Informe o seu endereço completo"
                        required
                        rows="3"></textarea>

                    <div class="invalid-feedback">
                        Informe seu endereço completo!
                    </div>
                </div>


                <button
                    type="submit"
                    class="btn btn-cadastrar w-100">
                    Cadastrar
                </button>

            </form>

            </div>

        </div>

    </div>
